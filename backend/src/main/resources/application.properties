server.port=${PORT:8082}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/resume_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload properties
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (Configured dynamically at the top of the file)

# Gemini AI
# Legacy key property for backwards compatibility:
gemini.api.key=${ATS_GEMINI_API_KEY:YOUR_API_KEY}

# Automatic API key fallback/rotation:
# Define environment variables GEMINI_API_KEY_1, GEMINI_API_KEY_2, etc.
# to automatically enable rotation on rate limit/quota limits (HTTP 429, 503, etc.).

